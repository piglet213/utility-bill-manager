<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전기,물,가스 사용현황 2025</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>전기,물,가스 사용현황 2025</h1>
            <p>월별 전기, 수도, 가스 사용량 그래프</p>
        </header>

        <div class="charts-grid">
            <div class="chart-card">
                <h2>수도 사용량 (m³)</h2>
                <canvas id="waterChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>전기 사용량 (kWh)</h2>
                <canvas id="electricityChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>가스 사용량 (m³)</h2>
                <canvas id="gasChart"></canvas>
            </div>
        </div>

        <div class="card-section">
            <h2>월별 검침 데이터</h2>
            <!-- Year Tabs -->
            <div id="yearTabs" class="tabs"></div>

            <div class="table-responsive">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Wasser Haus</th>
                            <th>Praxis Blau</th>
                            <th>Praxis Rot</th>
                            <th>Strom Haus</th>
                            <th>Strom Praxis</th>
                            <th>Gas</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows generated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Add Button Section -->
            <div style="text-align: center; margin-top: 20px;">
                <button id="addYearBtn" class="primary-button">내년도 추가 (+1 Year)</button>
                <div style="margin-top: 10px;">
                    <button id="saveBtn" class="secondary-button" style="margin-right: 10px;">파일로 저장 (Save)</button>
                    <button id="loadBtn" class="secondary-button">파일 불러오기 (Load)</button>
                    <input type="file" id="fileInput" accept=".csv" hidden>
                </div>
            </div>

            <p class="footnote">
                ※ 9월, 10월 데이터는 선형 보간법으로 계산된 <strong>추정치</strong>입니다 (주황색 표시).
            </p>
        </div>
    </div>
    <script src="app.js?v=1.8"></script>
</body>

</html>
